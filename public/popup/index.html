<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="appName">Dev File Viewer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <img
          class="logo"
          src="../assets/icons/icon48.png"
          srcset="../assets/icons/icon48.png 1x, ../assets/icons/icon128.png 2x"
          width="38"
          height="38"
          alt="Dev File Viewer"
        />
        <div>
          <h1 data-i18n="appName">Dev File Viewer</h1>
          <p data-i18n="appTagline">Markdown, Diff & Source Viewer</p>
        </div>
      </header>

      <button id="open-current" type="button" data-i18n="popupOpenCurrent">Open current tab</button>
      <button id="open-viewer" type="button" data-i18n="popupOpenViewer">Open viewer</button>
      <button id="open-app-settings" type="button" data-i18n="popupOpenSettings">
        Open Settings
      </button>

      <section id="file-url-card" class="file-url-card">
        <strong data-i18n="fileUrlAccessTitle">file:// URL access</strong>
        <span id="file-url-status" data-i18n="popupChecking">Checking...</span>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
