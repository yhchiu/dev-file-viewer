<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dev File Viewer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <div class="logo">DF</div>
        <div>
          <h1>Dev File Viewer</h1>
          <p>Markdown, Diff & Source Viewer</p>
        </div>
      </header>

      <button id="open-current" type="button">Open current tab</button>
      <button id="open-viewer" type="button">Open viewer</button>

      <section id="file-url-card" class="file-url-card">
        <strong>file:// URL access</strong>
        <span id="file-url-status">Checking...</span>
        <div class="file-url-actions">
          <button id="open-settings" type="button">Open Settings</button>
          <button id="copy-settings-link" type="button">Copy Link</button>
        </div>
      </section>

      <section class="hint">
        <strong>Recommended for local files</strong>
        <span>Use Open File or Open Folder in the viewer. No extra Chrome setting is required.</span>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
