<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dev File Viewer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <div class="logo">DF</div>
        <div>
          <h1>Dev File Viewer</h1>
          <p>Markdown, Diff &amp; Source Viewer</p>
        </div>
      </header>

      <button id="open-current" type="button">Open current tab</button>
      <button id="open-viewer" type="button">Open viewer</button>

      <section class="hint">
        <strong>Local files</strong>
        <span>For file:// URLs, enable “Allow access to file URLs” in chrome://extensions.</span>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
