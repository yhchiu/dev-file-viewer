  <!-- 48px line icons -->
  <symbol id="drop-file" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 30v8a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4v-8" />
    <path d="M14 22 24 32 34 22" />
    <path d="M24 32V6" />
  </symbol>
</svg>
