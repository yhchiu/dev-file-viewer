<svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
  <!-- Icons referenced from the extension's own HTML pages. Icons rendered
       from JavaScript live in src/core/ui/icons.js instead, because the
       content script draws them into file:// pages that cannot load this
       sprite. "arrow-right" is needed in both places. -->

  <!-- 16px line icons -->
  <symbol id="arrow-right" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3.5 10.5 8 6 12.5" />
  </symbol>
  <symbol id="arrow-left" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 3.5 5.5 8 10 12.5" />
  </symbol>

  <!-- 24px line icons -->
  <symbol id="sidebar-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="5" width="16" height="14" rx="2" />
    <path d="M9 5v14M16 9l-3 3 3 3" />
  </symbol>
  <symbol id="sidebar-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="5" width="16" height="14" rx="2" />
    <path d="M9 5v14M13 9l3 3-3 3" />
  </symbol>
  <symbol id="open-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3.75h7l4.5 4.5V20.25H6z" />
    <path d="M13 3.75v4.5h4.5M12 12v5M9.5 14.5h5" />
  </symbol>
  <symbol id="open-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 7.5a2 2 0 0 1 2-2h4.4l2 2H19a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
    <path d="M12 11.25v5M9.5 13.75h5" />
  </symbol>
  <symbol id="open-url" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1" />
  </symbol>
  <symbol id="files" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
  </symbol>
  <symbol id="outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
  </symbol>
  <symbol id="settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3" />
