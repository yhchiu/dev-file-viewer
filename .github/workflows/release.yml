name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run zip
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dev-file-viewer-*-dist.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
